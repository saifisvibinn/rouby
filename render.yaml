services:
  - type: web
    name: rouby-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rouby-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: rouby-db
    plan: free
    databaseName: rouby
    user: rouby
